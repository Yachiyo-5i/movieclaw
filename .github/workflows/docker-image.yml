# =============================================================================
# Docker 镜像发布流水线
#
# 在 amd64 / arm64 原生 runner 上分别构建，再合并为一个多架构 manifest，
# 推送到 Docker Hub（docker.io/<DOCKERHUB_USERNAME>/movieclaw）。
#
# 两个入口：
#   1. release.yml 在发版产物构建成功后自动调用（workflow_call）——
#      每次应用发版都会同步发布同版本号的镜像
#   2. 手动触发（Actions → docker-image → Run workflow）——补发或
#      单独发镜像时用
#
# 标签策略：正式版打 <tag> + runtime-N + latest 三个标签；
# 预发布版（tag 含 "-"，如 v0.3.0-beta.1）只打 <tag>，不动 latest，
# 避免 beta 被 docker pull 默认拉到。
#
# 为什么不用 QEMU 单机跨构建：Next.js 构建与 QEMU 模拟阶段并行时会间歇性
# 挂死（详见 scripts/build-image.sh 头注释）。公开仓库的 arm64 原生 runner
# 免费，两边都原生构建，又快又稳。
#
# 依赖的仓库配置（Settings → Secrets and variables → Actions）：
#   变量  DOCKERHUB_USERNAME  Docker Hub 用户名（镜像命名空间）
#   机密  DOCKERHUB_TOKEN     Docker Hub 访问令牌（Read & Write 权限）
#   机密  TMDB_API_KEY        烧进镜像的默认 TMDB Key
# =============================================================================
name: docker-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（如 v0.2.0，一般与当时的应用版本一致）"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "镜像标签（与应用 Release tag 一致）"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/movieclaw

jobs:
  # 每个架构在自己的原生 runner 上构建，先只按 digest 推送（不打标签），
  # 最后由 merge 作业把两个 digest 合成一个多架构 manifest 再打标签。
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并按 digest 推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Next.js 构建的并行 worker 靠 /dev/shm 通信，默认 64MB 会静默死锁
          shm-size: 2g
          build-args: |
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # Dockerfile 已在构建层跑过真实 PGS → SRT；这里再拉回“已经推送的 digest”
      # 验证最终产物，避免导出/推送或架构标记错误后仍进入 manifest。
      - name: 验证已推送镜像的字幕运行时
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          REF="$IMAGE@$DIGEST"
          docker pull "$REF"
          ACTUAL_PLATFORM="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$REF")"
          if [ "$ACTUAL_PLATFORM" != "$EXPECTED_PLATFORM" ]; then
            echo "::error::镜像架构错误：期望 $EXPECTED_PLATFORM，实际 $ACTUAL_PLATFORM"
            exit 1
          fi
          docker run --rm \
            --entrypoint /usr/local/bin/movieclaw-subtitle-smoke-test \
            "$REF"
          docker run --rm -i \
            --entrypoint /venv/bin/python \
            "$REF" - <<'PY'
          from movieclaw_api.services.subtitle_gen import pgs

          failures = []
          for code in pgs.OCR_LANGUAGE_LABELS:
              capability = pgs.detect_capability(code)
              expected_language = pgs._TESSERACT_LANGUAGES[code]
              if not (
                  capability.available
                  and capability.platform == "Linux"
                  and capability.engine == "tesseract"
                  and capability.ocr_language == expected_language
              ):
                  failures.append(f"{code}: {capability}")
          if failures:
              raise SystemExit("MovieClaw PGS 能力预检失败：\n" + "\n".join(failures))
          print(f"MovieClaw PGS 能力预检通过：{len(pgs.OCR_LANGUAGE_LABELS)} 种语言")
          PY

      - name: 导出 digest 供合并作业使用
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 只为读 docker/runtime-version，给镜像补一个 runtime-N 标签
      - uses: actions/checkout@v4

      - name: 下载各架构 digest
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 合并多架构 manifest 并打标签推送
        working-directory: /tmp/digests
        run: |
          TAGS=(-t "$IMAGE:${{ inputs.tag }}")
          # 预发布（tag 含 "-"）只打版本号标签，不推 latest / runtime-N
          case "${{ inputs.tag }}" in
            *-*) ;;
            *)
              RUNTIME="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/docker/runtime-version")"
              TAGS+=(-t "$IMAGE:runtime-$RUNTIME" -t "$IMAGE:latest")
              ;;
          esac
          docker buildx imagetools create "${TAGS[@]}" $(printf "$IMAGE@sha256:%s " *)

      - name: 检查推送结果
        run: |
          REF="$IMAGE:${{ inputs.tag }}"
          docker buildx imagetools inspect "$REF"
          PLATFORMS="$(docker buildx imagetools inspect --raw "$REF" \
            | jq -r '[.manifests[].platform | select(.os == "linux") | "\(.os)/\(.architecture)"] | unique | sort | join(",")')"
          if [ "$PLATFORMS" != "linux/amd64,linux/arm64" ]; then
            echo "::error::多架构 manifest 不完整：$PLATFORMS"
            exit 1
          fi
          echo "多架构 manifest 校验通过：$PLATFORMS"
