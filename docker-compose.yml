# =============================================================================
# movieclaw 部署示例（Docker / NAS）
#
# 快速开始：
#   1. 按需修改下面的媒体目录挂载
#   2. docker compose up -d
#   3. 浏览器打开 http://<主机IP>:3000，按引导创建管理员账号
#
# 说明：
#   - 镜像已内置 TMDB Key、NER 模型、PGS 转换器及 11 种 OCR 语言包
#   - 同一镜像标签同时支持 linux/amd64 与 linux/arm64，Docker 会自动选择
#   - ./data 保存全部运行数据（数据库、日志、密钥、缓存、上传），备份它即可
#   - 媒体目录按你的实际路径挂载，容器内路径将用于「设置 → 媒体库/监听导入」
# =============================================================================
services:
  movieclaw:
    # 官方镜像（Docker Hub）。自己用 scripts/build-image.sh 从源码构建的话，
    # 把这一行改成本地镜像名：movieclaw:latest
    image: movieclaw/movieclaw:latest
    container_name: movieclaw
    init: true
    ports:
      - "3000:3000"
      # Jellyfin 兼容层的局域网自动发现（可选）。注意：桥接网络下广播报文
      # 通常到不了容器，要用自动发现请改 host 网络或在控制台配置对外发布地址；
      # 播放器手动填地址连接不依赖此端口
      - "7359:7359/udp"
    volumes:
      # 运行数据（必须）
      - ./data:/app/data
      # 媒体盘挂载示例（按实际情况修改/增删）：
      # - /volume1/media:/media
      # 下载器的保存目录也要以相同路径挂进来，movieclaw 才能对下载完成的文件做入库整理：
      # - /volume1/downloads:/downloads
    environment:
      # 时区影响定时任务与日志时间戳
      - TZ=Asia/Shanghai
      # 如需覆盖镜像内置的 TMDB Key，取消注释：
      # - TMDB_API_KEY=你自己的key
      # 应用内更新（设置 → 关于与更新）下载 GitHub Release 慢时，可配加速
      # 镜像前缀（ghproxy 风格；下载后仍会按官方清单做 sha256 校验）：
      # - UPDATE_DOWNLOAD_MIRROR=https://ghproxy.com/
      # 公网 HTTPS 部署时建议开启（Cookie 仅走 https）：
      # - SESSION_COOKIE_SECURE=true
      # Emby/Jellyfin 入库通知（可选）：
      # - MEDIA_SERVER_URL=http://192.168.1.10:8096
      # - MEDIA_SERVER_TOKEN=xxxx
    restart: unless-stopped
